 name: Run Scanner Daily
on:
  schedule:
    - cron: '20 3 * * 1-5'
    - cron: '25 3 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '40 3 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '50 3 * * 1-5'
    - cron: '55 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '5 4 * * 1-5'
    - cron: '10 4 * * 1-5'
    - cron: '15 4 * * 1-5'
    - cron: '20 4 * * 1-5'
    - cron: '25 4 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '35 4 * * 1-5'
    - cron: '40 4 * * 1-5'
    - cron: '45 4 * * 1-5'
    - cron: '50 4 * * 1-5'
    - cron: '55 4 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '15 5 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
